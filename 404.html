<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/main.js"></script>
  <title>Page not found — Tanagorn Fukuhara</title>
</head>
<body>
  <main class="error-page" id="main-content">
    <div class="error-content">
      <p class="error-code" aria-hidden="true">404</p>
      <h1>This route doesn’t exist.</h1>
      <p>The page may have moved, or the system received a path it doesn’t recognize.</p>
      <a class="button button-primary" href="/">Return home <span aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
